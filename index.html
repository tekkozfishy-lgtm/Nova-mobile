<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#05070d"
>

<link
    rel="manifest"
    href="./manifest.json"
>

<title>NOVA</title>


<style>

/* =========================
   NOVA
   Main UI
========================= */

:root {

    --bg: #05070d;
    --panel: #0c111b;
    --border: #1c2737;

    --text: #f4f7ff;
    --muted: #8290a6;

    --accent: #63ddff;

}


* {

    box-sizing: border-box;

}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 35%,
            #112033 0%,
            #070a12 42%,
            #030408 100%
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}


button,
input {

    font: inherit;

}


/* =========================
   APP
========================= */

.app {

    width: 100%;

    height: 100dvh;

    display: flex;

    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

}


/* =========================
   HEADER
========================= */

header {

    height: 70px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


.logo {

    font-size: 21px;

    font-weight: 700;

    letter-spacing: 7px;

}


.status {

    position: absolute;

    left: 20px;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #49e58c;

    box-shadow:
        0 0 13px #49e58c;

}


.settings {

    position: absolute;

    right: 17px;

    width: 42px;

    height: 42px;

    border-radius: 50%;

    border: 1px solid var(--border);

    background:
        rgba(
            15,
            21,
            32,
            .75
        );

    color: white;

    font-size: 19px;

}


/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =========================
   ORB
========================= */

.orb-container {

    width: 250px;

    height: 250px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

}


.ring {

    position: absolute;

    width: 185px;

    height: 185px;

    border-radius: 50%;

    border:

        1px solid
        rgba(
            99,
            221,
            255,
            .18
        );

    animation:

        breathe
        4s
        ease-in-out
        infinite;

}


.ring.two {

    width: 225px;

    height: 225px;

    opacity: .5;

    animation-delay: 1.2s;

}


/* Main orb */

.orb {

    width: 145px;

    height: 145px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    user-select: none;

    border:

        1px solid
        rgba(
            120,
            230,
            255,
            .75
        );

    background:

        radial-gradient(
            circle at 32% 28%,
            #a1f2ff 0%,
            #2d9dbf 19%,
            #12344d 54%,
            #060b13 100%
        );

    box-shadow:

        0 0 30px
        rgba(
            99,
            221,
            255,
            .4
        ),

        inset 0 0 35px
        rgba(
            99,
            221,
            255,
            .25
        );

    transition:

        transform .18s ease,
        box-shadow .3s ease;

}


.orb:active {

    transform:
        scale(.93);

}


.orb-core {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            white 0%,
            #a5f2ff 35%,
            transparent 72%
        );

    filter:

        drop-shadow(
            0 0 12px
            #8beeff
        );

}


/* =========================
   ORB STATES
========================= */

.orb.listening {

    animation:

        listening
        1.1s
        ease-in-out
        infinite;

    box-shadow:

        0 0 55px
        rgba(
            99,
            221,
            255,
            .85
        ),

        inset 0 0 45px
        rgba(
            99,
            221,
            255,
            .5
        );

}


.orb.thinking {

    animation:

        thinking
        1.5s
        linear
        infinite;

}


.orb.speaking {

    animation:

        speaking
        .5s
        ease-in-out
        infinite;

}


/* =========================
   ANIMATIONS
========================= */

@keyframes breathe {

    0%,
    100% {

        transform:
            scale(.94);

        opacity: .35;

    }

    50% {

        transform:
            scale(1.06);

        opacity: .8;

    }

}


@keyframes listening {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.1);

    }

    100% {

        transform:
            scale(1);

    }

}


@keyframes thinking {

    from {

        transform:
            rotate(0deg)
            scale(1);

    }

    to {

        transform:
            rotate(360deg)
            scale(1.04);

    }

}


@keyframes speaking {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.1);

    }

    100% {

        transform:
            scale(1);

    }

}


/* =========================
   STATUS
========================= */

.state {

    min-height: 23px;

    font-size: 15px;

    letter-spacing: 1px;

    color: var(--muted);

}


.hint {

    margin-top: 8px;

    font-size: 12px;

    color:

        rgba(
            130,
            144,
            166,
            .6
        );

}


/* =========================
   CHAT
========================= */

.chat {

    position: fixed;

    left: 15px;

    right: 15px;

    bottom: 125px;

    max-height: 23vh;

    overflow-y: auto;

}


.message {

    width: fit-content;

    max-width: 85%;

    margin-bottom: 8px;

    padding:
        10px 14px;

    border-radius: 16px;

    background:
        rgba(
            13,
            18,
            28,
            .85
        );

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .05
        );

    font-size: 14px;

    line-height: 1.4;

}


.message.user {

    margin-left: auto;

    background:
        rgba(
            31,
            50,
            73,
            .95
        );

}


/* =========================
   INPUT
========================= */

.bottom {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    padding:

        10px 13px;

    padding-bottom:

        calc(
            10px +
            env(
                safe-area-inset-bottom
            )
        );

    background:

        rgba(
            5,
            7,
            13,
            .92
        );

    backdrop-filter:
        blur(18px);

    border-top:

        1px solid
        var(--border);

}


.input-box {

    display: flex;

    align-items: center;

    gap: 8px;

    max-width: 700px;

    margin: auto;

}


input {

    flex: 1;

    min-width: 0;

    height: 48px;

    padding:
        0 17px;

    border-radius: 25px;

    border:

        1px solid
        var(--border);

    outline: none;

    background:

        rgba(
            17,
            24,
            36,
            .95
        );

    color: white;

    font-size: 16px;

}


input::placeholder {

    color: #6f7b90;

}


.send {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:

        1px solid
        var(--border);

    background:
        #142233;

    color:
        var(--accent);

    font-size: 20px;

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .orb-container {

        width: 290px;

        height: 290px;

    }

    .orb {

        width: 175px;

        height: 175px;

    }

    .chat {

        max-width: 650px;

        left: 50%;

        right: auto;

        width: 650px;

        transform:
            translateX(-50%);

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="status"></div>

    <div class="logo">
        NOVA
    </div>

    <button
        class="settings"
        id="settings"
        aria-label="Settings"
    >
        ⚙
    </button>

</header>


<main class="main">


    <div
        class="orb-container"
    >

        <div class="ring"></div>

        <div class="ring two"></div>


        <div
            class="orb"
            id="orb"
            role="button"
            tabindex="0"
            aria-label="Talk to NOVA"
        >

            <div
                class="orb-core"
            ></div>

        </div>

    </div>


    <div
        class="state"
        id="state"
    >
        Ready
    </div>


    <div class="hint">
        Tap NOVA to speak
    </div>


</main>


<div
    class="chat"
    id="chat"
></div>


<div class="bottom">


    <div class="input-box">


        <input
            id="input"
            type="text"
            placeholder="Ask NOVA..."
            autocomplete="off"
        >


        <button
            class="send"
            id="send"
            aria-label="Send"
        >
            ↑
        </button>


    </div>

</div>


</div>


<!--
    LOCAL AI

    This loads the AI engine.
    It does NOT require an OpenAI API key.
-->

<script
    type="module"
    src="./ai.js"
></script>


<script>

/* =========================
   ELEMENTS
========================= */

const orb =
    document.getElementById(
        "orb"
    );

const state =
    document.getElementById(
        "state"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const chat =
    document.getElementById(
        "chat"
    );


/* =========================
   STATE
========================= */

function setState(
    text,
    mode = ""
) {

    state.textContent =
        text;

    orb.className =
        "orb";

    if (mode) {

        orb.classList.add(
            mode
        );

    }

}


/* =========================
   CHAT
========================= */

function addMessage(
    text,
    user = false
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message";

    if (user) {

        message.classList.add(
            "user"
        );

    }

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   SPEECH
========================= */

function speak(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        setState(
            "Ready"
        );

        return;

    }


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-GB";


    speech.rate =
        1;


    speech.pitch =
        1;


    speech.onstart =
        () => {

            setState(
                "Speaking...",
                "speaking"
            );

        };


    speech.onend =
        () => {

            setState(
                "Ready"
            );

        };


    speech.onerror =
        () => {

            setState(
                "Ready"
            );

        };


    speechSynthesis.speak(
        speech
    );

}


/* =========================
   LOCAL AI
========================= */

async function askLocalAI(
    message
) {

    if (
        !window.NOVA_AI
    ) {

        return null;

    }


    if (
        typeof
        window.NOVA_AI.ask
        !== "function"
    ) {

        return null;

    }


    try {

        setState(
            "Thinking...",
            "thinking"
        );


        const response =
            await window.NOVA_AI.ask(
                message
            );


        return response;


    } catch (error) {

        console.error(
            "NOVA AI error:",
            error
        );


        return null;

    }

}


/* =========================
   NOVA BRAIN
========================= */

async function nova(
    command
) {

    const text =
        command
            .trim()
            .toLowerCase();


    /* TIME */

    if (
        text === "time" ||
        text.includes(
            "what time"
        )
    ) {

        return (
            "The time is " +
            new Date()
                .toLocaleTimeString(
                    "en-GB",
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                ) +
            "."
        );

    }


    /* DATE */

    if (
        text === "date" ||
        text.includes(
            "what date"
        ) ||
        text.includes(
            "what day"
        )
    ) {

        return (
            "Today is " +
            new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:
                            "long",

                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                ) +
            "."
        );

    }


    /* GOOGLE */

    if (
        text.startsWith(
            "search google for "
        )
    ) {

        const query =
            command.substring(
                19
            );


        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(
                query
            ),
            "_blank"
        );


        return (
            "Searching Google for " +
            query +
            "."
        );

    }


    /* YOUTUBE */

    if (
        text.startsWith(
            "search youtube for "
        )
    ) {

        const query =
            command.substring(
                20
            );


        window.open(
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(
                query
            ),
            "_blank"
        );


        return (
            "Searching YouTube for " +
            query +
            "."
        );

    }


    /* GREETING */

    if (
        text === "hello" ||
        text === "hi" ||
        text === "hey"
    ) {

        return (
            "Hello. NOVA is online."
        );

    }


    /* IDENTITY */

    if (
        text.includes(
            "who are you"
        ) ||
        text.includes(
            "what are you"
        )
    ) {

        return (
            "I'm NOVA, your personal " +
            "AI assistant."
        );

    }


    /* LOCAL AI */

    const aiResponse =
        await askLocalAI(
            command
        );


    if (aiResponse) {

        return aiResponse;

    }


    /* FALLBACK */

    return (
        "My local AI is not ready yet. " +
        "Try again in a moment."
    );

}


/* =========================
   COMMAND
========================= */

async function command(
    text
) {

    if (
        !text.trim()
    ) {

        return;

    }


    addMessage(
        text,
        true
    );


    input.value =
        "";


    setState(
        "Thinking...",
        "thinking"
    );


    const response =
        await nova(
            text
        );


    addMessage(
        response
    );


    speak(
        response
    );

}


/* =========================
   SEND
========================= */

send.addEventListener(
    "click",
    () => {

        command(
            input.value
        );

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            command(
                input.value
            );

        }

    }
);


/* =========================
   VOICE INPUT
========================= */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (Recognition) {


    const recognition =
        new Recognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    /* START */

    orb.addEventListener(
        "click",
        () => {

            setState(
                "Listening...",
                "listening"
            );


            try {

                recognition.start();

            } catch {

                console.log(
                    "Already listening."
                );

            }

        }
    );


    /* RESULT */

    recognition.onresult =
        event => {

            const result =
                event
                    .results[0][0]
                    .transcript;


            command(
                result
            );

        };


    /* END */

    recognition.onend =
        () => {

            if (
                !orb.classList.contains(
                    "thinking"
                ) &&
                !orb.classList.contains(
                    "speaking"
                )
            ) {

                setState(
                    "Ready"
                );

            }

        };


    /* ERROR */

    recognition.onerror =
        event => {

            console.log(
                "Voice error:",
                event.error
            );


            setState(
                "Couldn't hear you"
            );


            setTimeout(
                () => {

                    setState(
                        "Ready"
                    );

                },
                1500
            );

        };

}


/* =========================
   SERVICE WORKER
========================= */

if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator
                .serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    error => {

                        console.log(
                            "SW error:",
                            error
                        );

                    }
                );

        }
    );

}


/* =========================
   START
========================= */

setState(
    "Ready"
);


console.log(
    "NOVA v2 online."
);

</script>


</body>

</html>
