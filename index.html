<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070910">

<title>NOVA</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070910;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    height: 100vh;
    height: 100dvh;

    overflow: hidden;
}

/* HEADER */

header {
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #10131c;

    border-bottom: 1px solid #252a36;

    font-size: 24px;
    font-weight: bold;
    letter-spacing: 4px;

    position: relative;
}

.status {
    position: absolute;

    left: 20px;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #45e477;

    box-shadow:
        0 0 12px #45e477;
}

/* CHAT */

#chat {
    height: calc(100dvh - 150px);

    overflow-y: auto;

    padding: 20px 15px 30px;
}

.message {
    max-width: 85%;

    padding: 13px 16px;

    margin-bottom: 12px;

    border-radius: 18px;

    background: #181c27;

    line-height: 1.4;
}

.user {
    margin-left: auto;

    background: #29354b;

    border-radius:
        18px 18px 5px 18px;
}

/* INPUT */

.controls {
    position: fixed;

    bottom: 0;

    width: 100%;

    padding: 10px 12px;

    padding-bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    gap: 8px;

    background: #10131c;

    border-top:
        1px solid #252a36;
}

input {
    flex: 1;

    min-width: 0;

    padding: 14px 17px;

    border: none;

    outline: none;

    border-radius: 25px;

    background: #202532;

    color: white;

    font-size: 16px;
}

button {
    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: #252b3a;

    color: white;

    font-size: 20px;
}

#send {
    border-radius: 15px;
}

button:active {
    transform: scale(0.94);
}

.listening {
    background: #a82f46;
}

</style>
</head>


<body>

<header>

    <div class="status"></div>

    NOVA

</header>


<div id="chat">

    <div class="message">

        Hello. I'm NOVA. 🤖

    </div>

</div>


<div class="controls">

    <button id="mic">
        🎙️
    </button>

    <input
        id="input"
        placeholder="Talk to NOVA..."
        autocomplete="off"
    >

    <button id="send">
        ➤
    </button>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    user = false
) {

    const message =
        document.createElement("div");

    message.className =
        "message";

    if (user) {
        message.classList.add("user");
    }

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   VOICE
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(
            text
        );

    voice.lang = "en-GB";

    voice.rate = 1;

    voice.pitch = 1;

    speechSynthesis.speak(
        voice
    );
}


/* =========================
   NOVA BRAIN
========================= */

function nova(command) {

    const text =
        command
            .toLowerCase()
            .trim();


    /* HELLO */

    if (
        text === "hello" ||
        text === "hi" ||
        text === "hey"
    ) {

        return (
            "Hello. NOVA is online."
        );

    }


    /* WHO ARE YOU */

    if (
        text.includes(
            "who are you"
        ) ||
        text.includes(
            "what are you"
        )
    ) {

        return (
            "I'm NOVA, your personal "
            + "mobile assistant."
        );

    }


    /* TIME */

    if (
        text === "time" ||
        text.includes(
            "what time"
        )
    ) {

        const now =
            new Date();

        return (
            "The time is " +

            now.toLocaleTimeString(
                "en-GB",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            )
        );

    }


    /* DATE */

    if (
        text === "date" ||
        text.includes(
            "what day"
        ) ||
        text.includes(
            "what date"
        )
    ) {

        const now =
            new Date();

        return (
            "Today is " +

            now.toLocaleDateString(
                "en-GB",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            )
        );

    }


    /* GOOGLE */

    if (
        text.startsWith(
            "search google for "
        )
    ) {

        const query =
            text.replace(
                "search google for ",
                ""
            );

        window.open(
            "https://www.google.com/search?q="
            +
            encodeURIComponent(
                query
            ),

            "_blank"
        );

        return (
            "Searching Google for "
            + query
            + "."
        );

    }


    /* YOUTUBE */

    if (
        text.startsWith(
            "search youtube for "
        )
    ) {

        const query =
            text.replace(
                "search youtube for ",
                ""
            );

        window.open(
            "https://www.youtube.com/results?search_query="
            +
            encodeURIComponent(
                query
            ),

            "_blank"
        );

        return (
            "Searching YouTube for "
            + query
            + "."
        );

    }


    /* HELP */

    if (
        text === "help" ||
        text.includes(
            "what can you do"
        )
    ) {

        return (
            "I can currently talk to you, "
            + "listen to your voice, tell "
            + "you the time and date, and "
            + "search Google and YouTube."
        );

    }


    /* UNKNOWN */

    return (
        "I don't know how to do that yet. "
        + "But we're going to teach me."
    );

}


/* =========================
   SEND
========================= */

function sendCommand() {

    const command =
        input.value.trim();

    if (!command) {
        return;
    }

    addMessage(
        command,
        true
    );

    input.value = "";


    const response =
        nova(command);


    setTimeout(
        () => {

            addMessage(
                response
            );

            speak(
                response
            );

        },

        250
    );

}


/* =========================
   BUTTON
========================= */

send.addEventListener(
    "click",
    sendCommand
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",

    event => {

        if (
            event.key === "Enter"
        ) {

            sendCommand();

        }

    }
);


/* =========================
   MICROPHONE
========================= */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (Recognition) {

    const recognition =
        new Recognition();

    recognition.lang =
        "en-GB";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    mic.addEventListener(
        "click",

        () => {

            mic.classList.add(
                "listening"
            );

            recognition.start();

        }
    );


    recognition.onresult =
        event => {

            const result =
                event
                    .results[0][0]
                    .transcript;

            input.value =
                result;

            mic.classList.remove(
                "listening"
            );

            sendCommand();

        };


    recognition.onend =
        () => {

            mic.classList.remove(
                "listening"
            );

        };


    recognition.onerror =
        () => {

            mic.classList.remove(
                "listening"
            );

        };

}
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
    });
}
</script>

</body>
</html>
