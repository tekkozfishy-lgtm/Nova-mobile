<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#05070d"
>

<link
    rel="manifest"
    href="./manifest.json"
>

<title>NOVA</title>


<style>

/* =========================
   NOVA UI
========================= */

:root {

    --background: #05070d;

    --panel: #0d111b;

    --border: #1d2635;

    --text: #f5f7ff;

    --muted: #7f8ba1;

    --accent: #5bdcff;

}


* {

    box-sizing: border-box;

}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    background:
        radial-gradient(
            circle at 50% 38%,
            #101b2d 0%,
            #05070d 45%,
            #030408 100%
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow: hidden;

}


/* =========================
   APP
========================= */

.app {

    height: 100dvh;

    display: flex;

    flex-direction: column;

    padding-top:
        env(safe-area-inset-top);

}


/* =========================
   HEADER
========================= */

header {

    height: 70px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


.logo {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 6px;

}


.status {

    position: absolute;

    left: 20px;

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #45e58b;

    box-shadow:
        0 0 12px #45e58b;

}


.settings {

    position: absolute;

    right: 18px;

    width: 42px;

    height: 42px;

    border-radius: 50%;

    border: 1px solid var(--border);

    background: rgba(
        15,
        20,
        30,
        .7
    );

    color: white;

    font-size: 20px;

}


/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    min-height: 0;

}


/* =========================
   ORB
========================= */

.orb-container {

    width: 230px;

    height: 230px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    margin-bottom: 25px;

}


/* Outer rings */

.ring {

    position: absolute;

    width: 190px;

    height: 190px;

    border-radius: 50%;

    border: 1px solid
        rgba(
            91,
            220,
            255,
            .18
        );

    animation:
        breathe 4s
        ease-in-out
        infinite;

}


.ring.two {

    width: 220px;

    height: 220px;

    opacity: .45;

    animation-delay: 1s;

}


/* Main orb */

.orb {

    width: 145px;

    height: 145px;

    border-radius: 50%;

    border: 1px solid
        rgba(
            120,
            230,
            255,
            .7
        );

    background:

        radial-gradient(
            circle at 35% 30%,
            #8beeff 0%,
            #248db5 20%,
            #102a43 55%,
            #070b14 100%
        );

    box-shadow:

        0 0 25px
            rgba(
                91,
                220,
                255,
                .35
            ),

        inset 0 0 30px
            rgba(
                91,
                220,
                255,
                .25
            );

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    user-select: none;

    transition:
        transform .2s ease,
        box-shadow .3s ease;

}


.orb:active {

    transform: scale(.94);

}


/* Orb centre */

.orb-core {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            white,
            #8beeff 35%,
            transparent 70%
        );

    filter:
        drop-shadow(
            0 0 10px
            #8beeff
        );

}


/* =========================
   STATES
========================= */

.orb.listening {

    animation:
        listenPulse
        1.2s
        ease-in-out
        infinite;

    box-shadow:

        0 0 45px
        rgba(
            91,
            220,
            255,
            .8
        ),

        inset 0 0 40px
        rgba(
            91,
            220,
            255,
            .5
        );

}


.orb.thinking {

    animation:
        thinking
        1.5s
        linear
        infinite;

}


.orb.speaking {

    animation:
        speaking
        .55s
        ease-in-out
        infinite;

}


/* =========================
   ANIMATIONS
========================= */

@keyframes breathe {

    0%,
    100% {

        transform:
            scale(.95);

        opacity: .4;

    }

    50% {

        transform:
            scale(1.05);

        opacity: .8;

    }

}


@keyframes listenPulse {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.08);

    }

    100% {

        transform:
            scale(1);

    }

}


@keyframes thinking {

    from {

        transform:
            rotate(0deg)
            scale(1);

    }

    to {

        transform:
            rotate(360deg)
            scale(1.05);

    }

}


@keyframes speaking {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.1);

    }

    100% {

        transform:
            scale(1);

    }

}


/* =========================
   STATUS TEXT
========================= */

.state {

    font-size: 15px;

    color: var(--muted);

    letter-spacing: 1px;

    min-height: 22px;

}


.hint {

    margin-top: 10px;

    font-size: 12px;

    color:
        rgba(
            127,
            139,
            161,
            .65
        );

}


/* =========================
   CHAT
========================= */

.chat {

    position: absolute;

    bottom: 125px;

    left: 15px;

    right: 15px;

    max-height: 22vh;

    overflow-y: auto;

}


.message {

    width: fit-content;

    max-width: 85%;

    padding:
        10px 14px;

    margin:
        0 0 8px;

    border-radius: 15px;

    background:
        rgba(
            15,
            20,
            30,
            .8
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .05
        );

    font-size: 14px;

    line-height: 1.4;

}


.message.user {

    margin-left: auto;

    background:
        rgba(
            35,
            52,
            75,
            .9
        );

}


/* =========================
   INPUT
========================= */

.bottom {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    padding:
        10px 13px;

    padding-bottom:
        calc(
            10px +
            env(
                safe-area-inset-bottom
            )
        );

    background:
        rgba(
            7,
            9,
            16,
            .9
        );

    backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        var(--border);

}


.input-box {

    display: flex;

    align-items: center;

    gap: 8px;

    max-width: 700px;

    margin: auto;

}


input {

    flex: 1;

    min-width: 0;

    border:
        1px solid
        var(--border);

    outline: none;

    background:
        rgba(
            20,
            26,
            38,
            .95
        );

    color: white;

    padding:
        13px 17px;

    border-radius: 25px;

    font-size: 16px;

}


.send {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        var(--border);

    background:
        #172333;

    color:
        var(--accent);

    font-size: 19px;

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .orb-container {

        width: 280px;

        height: 280px;

    }

    .orb {

        width: 175px;

        height: 175px;

    }

    .chat {

        max-width: 650px;

        margin: auto;

    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="status"></div>

    <div class="logo">
        NOVA
    </div>

    <button
        class="settings"
        id="settings"
    >
        ⚙
    </button>

</header>


<main class="main">


    <div
        class="orb-container"
        id="orbContainer"
    >

        <div class="ring"></div>

        <div class="ring two"></div>


        <div
            class="orb"
            id="orb"
            role="button"
            aria-label="Talk to NOVA"
        >

            <div class="orb-core"></div>

        </div>

    </div>


    <div
        class="state"
        id="state"
    >

        Ready

    </div>


    <div class="hint">

        Tap NOVA to speak

    </div>


</main>


<div
    class="chat"
    id="chat"
></div>


<div class="bottom">


    <div class="input-box">


        <input
            id="input"
            placeholder="Ask NOVA..."
            autocomplete="off"
        >


        <button
            class="send"
            id="send"
        >

            ↑

        </button>


    </div>


</div>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const orb =
    document.getElementById(
        "orb"
    );

const state =
    document.getElementById(
        "state"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const chat =
    document.getElementById(
        "chat"
    );


/* =========================
   STATE
========================= */

function setState(
    text,
    mode = ""
) {

    state.textContent =
        text;

    orb.className =
        "orb " + mode;

}


/* =========================
   MESSAGE
========================= */

function addMessage(
    text,
    user = false
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message";

    if (user) {

        message.classList.add(
            "user"
        );

    }

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   SPEAK
========================= */

function speak(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(
            text
        );


    voice.lang =
        "en-GB";


    voice.rate =
        1;


    voice.pitch =
        1;


    voice.onstart =
        () => {

            setState(
                "Speaking...",
                "speaking"
            );

        };


    voice.onend =
        () => {

            setState(
                "Ready"
            );

        };


    speechSynthesis.speak(
        voice
    );

}


/* =========================
   NOVA BRAIN
========================= */

function nova(
    command
) {

    const text =
        command
            .toLowerCase()
            .trim();


    if (
        text === "hello" ||
        text === "hi" ||
        text === "hey"
    ) {

        return (
            "Hello. NOVA is online."
        );

    }


    if (
        text.includes(
            "who are you"
        )
    ) {

        return (
            "I'm NOVA, your personal "
            + "mobile assistant."
        );

    }


    if (
        text.includes(
            "what time"
        ) ||
        text === "time"
    ) {

        return (
            "The time is "
            +
            new Date()
                .toLocaleTimeString(
                    "en-GB",
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                )
            +
            "."
        );

    }


    if (
        text.includes(
            "what day"
        ) ||
        text.includes(
            "what date"
        ) ||
        text === "date"
    ) {

        return (
            "Today is "
            +
            new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:
                            "long",

                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                )
            +
            "."
        );

    }


    if (
        text.includes(
            "what can you do"
        ) ||
        text === "help"
    ) {

        return (
            "I can currently listen "
            + "to you, speak replies, "
            + "tell you the time and "
            + "date, and search the web."
        );

    }


    return (
        "I don't know how to do "
        + "that yet. We're going "
        + "to teach me."
    );

}


/* =========================
   COMMAND
========================= */

function command(
    text
) {

    if (!text.trim()) {

        return;

    }


    addMessage(
        text,
        true
    );


    input.value =
        "";


    setState(
        "Thinking...",
        "thinking"
    );


    setTimeout(
        () => {

            const response =
                nova(text);


            addMessage(
                response
            );


            speak(
                response
            );

        },

        500
    );

}


/* =========================
   SEND BUTTON
========================= */

send.addEventListener(
    "click",

    () => {

        command(
            input.value
        );

    }

);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",

    event => {

        if (
            event.key === "Enter"
        ) {

            command(
                input.value
            );

        }

    }

);


/* =========================
   VOICE
========================= */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (Recognition) {


    const recognition =
        new Recognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    orb.addEventListener(
        "click",

        () => {

            setState(
                "Listening...",
                "listening"
            );


            try {

                recognition.start();

            }

            catch {

                // Already listening

            }

        }

    );


    recognition.onresult =
        event => {

            const result =
                event
                    .results[0][0]
                    .transcript;


            setState(
                "Thinking...",
                "thinking"
            );


            command(
                result
            );

        };


    recognition.onend =
        () => {

            if (
                !orb.classList.contains(
                    "thinking"
                ) &&
                !orb.classList.contains(
                    "speaking"
                )
            ) {

                setState(
                    "Ready"
                );

            }

        };


    recognition.onerror =
        () => {

            setState(
                "Couldn't hear you"
            );

            setTimeout(
                () => {

                    setState(
                        "Ready"
                    );

                },

                1500
            );

        };


}


/* =========================
   SERVICE WORKER
========================= */

if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",

        () => {

            navigator.serviceWorker
                .register(
                    "./sw.js"
                );

        }

    );

}
<script type="module" src="./ai.js"></script>

</script>


</body>

</html>
