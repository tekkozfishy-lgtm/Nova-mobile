<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#05070d"
>

<link
    rel="manifest"
    href="./manifest.json"
>

<title>NOVA</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background:

        radial-gradient(
            circle at center,
            #122235,
            #05070d 65%
        );

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}


.app {

    height: 100dvh;

    display: flex;

    flex-direction: column;

}


header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


.logo {

    font-size: 21px;

    font-weight: 700;

    letter-spacing: 7px;

}


.status {

    position: absolute;

    left: 20px;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #4cff9a;

    box-shadow:
        0 0 15px #4cff9a;

}


/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.orb-container {

    width: 250px;

    height: 250px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

}


.ring {

    position: absolute;

    width: 190px;

    height: 190px;

    border-radius: 50%;

    border:
        1px solid
        rgba(
            99,
            221,
            255,
            .25
        );

    animation:
        pulse 4s
        ease-in-out
        infinite;

}


.ring.two {

    width: 225px;

    height: 225px;

    animation-delay: 1s;

    opacity: .5;

}


.orb {

    width: 145px;

    height: 145px;

    border-radius: 50%;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at 30% 25%,
            #c6f8ff,
            #2d9dbf 22%,
            #12344d 55%,
            #050a12
        );

    border:
        1px solid
        rgba(
            130,
            235,
            255,
            .8
        );

    box-shadow:

        0 0 35px
        rgba(
            99,
            221,
            255,
            .5
        ),

        inset 0 0 35px
        rgba(
            99,
            221,
            255,
            .25
        );

}


.orb-core {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            white,
            #9cefff 35%,
            transparent 70%
        );

    box-shadow:
        0 0 20px
        #9cefff;

}


.orb.listening {

    animation:
        listening 1s
        ease-in-out
        infinite;

}


.orb.thinking {

    animation:
        thinking 1.5s
        linear
        infinite;

}


.orb.speaking {

    animation:
        speaking .5s
        ease-in-out
        infinite;

}


@keyframes pulse {

    0%,
    100% {

        transform: scale(.95);

        opacity: .3;

    }

    50% {

        transform: scale(1.06);

        opacity: .8;

    }

}


@keyframes listening {

    50% {

        transform: scale(1.1);

    }

}


@keyframes thinking {

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes speaking {

    50% {

        transform: scale(1.1);

    }

}


/* =========================
   STATUS
========================= */

.state {

    margin-top: 5px;

    color: #8a98ad;

    letter-spacing: 1px;

}


.hint {

    margin-top: 8px;

    color: #667389;

    font-size: 12px;

}


/* =========================
   CHAT
========================= */

.chat {

    position: fixed;

    left: 15px;

    right: 15px;

    bottom: 120px;

    max-height: 25vh;

    overflow-y: auto;

}


.message {

    width: fit-content;

    max-width: 85%;

    padding: 10px 14px;

    margin-bottom: 8px;

    border-radius: 16px;

    background:
        rgba(
            15,
            22,
            34,
            .9
        );

}


.message.user {

    margin-left: auto;

    background:
        rgba(
            31,
            51,
            74,
            .95
        );

}


/* =========================
   INPUT
========================= */

.bottom {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    padding:
        10px 13px
        calc(
            10px +
            env(
                safe-area-inset-bottom
            )
        );

    background:
        rgba(
            5,
            7,
            13,
            .94
        );

    backdrop-filter:
        blur(18px);

}


.input-box {

    display: flex;

    gap: 8px;

    max-width: 700px;

    margin: auto;

}


input {

    flex: 1;

    height: 48px;

    border-radius: 25px;

    border:
        1px solid #1c2737;

    background:
        #111824;

    color: white;

    padding:
        0 17px;

    outline: none;

    font-size: 16px;

}


.send {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid #1c2737;

    background:
        #142233;

    color:
        #63ddff;

    font-size: 20px;

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="status"></div>

    <div class="logo">
        NOVA
    </div>

</header>


<main class="main">


    <div class="orb-container">

        <div class="ring"></div>

        <div class="ring two"></div>


        <div
            class="orb"
            id="orb"
        >

            <div
                class="orb-core"
            ></div>

        </div>

    </div>


    <div
        class="state"
        id="state"
    >
        Starting NOVA...
    </div>


    <div class="hint">
        Tap NOVA to speak
    </div>


</main>


<div
    class="chat"
    id="chat"
></div>


<div class="bottom">


    <div class="input-box">


        <input
            id="input"
            placeholder="Ask NOVA..."
            autocomplete="off"
        >


        <button
            id="send"
            class="send"
        >
            ↑
        </button>


    </div>

</div>


</div>


<script
    type="module"
    src="./ai.js"
></script>


<script>

/* =========================
   ELEMENTS
========================= */

const orb =
    document.getElementById(
        "orb"
    );

const state =
    document.getElementById(
        "state"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const chat =
    document.getElementById(
        "chat"
    );


/* =========================
   STATE
========================= */

function setState(
    text,
    mode = ""
) {

    state.textContent =
        text;

    orb.className =
        "orb";

    if (mode) {

        orb.classList.add(
            mode
        );

    }

}


/* =========================
   CHAT
========================= */

function addMessage(
    text,
    user = false
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message";

    if (user) {

        message.classList.add(
            "user"
        );

    }

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   SPEECH OUTPUT
========================= */

function speak(
    text
) {

    if (
        !window.speechSynthesis
    ) {

        console.log(
            "Speech synthesis unavailable."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-GB";


    utterance.rate =
        1;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    utterance.onstart =
        () => {

            setState(
                "Speaking...",
                "speaking"
            );

        };


    utterance.onend =
        () => {

            setState(
                "Ready"
            );

        };


    utterance.onerror =
        event => {

            console.log(
                "Speech error:",
                event
            );

            setState(
                "Ready"
            );

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================
   AI
========================= */

async function getAIResponse(
    text
) {

    if (
        !window.NOVA_AI
    ) {

        return null;

    }


    try {

        setState(
            "Thinking...",
            "thinking"
        );


        const response =
            await window.NOVA_AI.ask(
                text
            );


        if (
            response &&
            response.trim()
        ) {

            return response.trim();

        }


        return null;

    } catch (error) {

        console.error(
            "AI error:",
            error
        );

        return null;

    }

}


/* =========================
   NOVA
========================= */

async function nova(
    text
) {

    const lower =
        text
            .trim()
            .toLowerCase();


    if (
        lower === "time" ||
        lower.includes(
            "what time"
        )
    ) {

        return (
            "The time is " +
            new Date()
                .toLocaleTimeString(
                    "en-GB",
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit"
                    }
                ) +
            "."
        );

    }


    if (
        lower.includes(
            "what day"
        ) ||
        lower.includes(
            "what date"
        )
    ) {

        return (
            "Today is " +
            new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:
                            "long",

                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                ) +
            "."
        );

    }


    if (
        lower === "hello" ||
        lower === "hi" ||
        lower === "hey"
    ) {

        return (
            "Hello. NOVA is online."
        );

    }


    if (
        lower.includes(
            "who are you"
        )
    ) {

        return (
            "I'm NOVA, your personal " +
            "AI assistant."
        );

    }


    const response =
        await getAIResponse(
            text
        );


    if (response) {

        return response;

    }


    return (
        "My local AI isn't ready yet."
    );

}


/* =========================
   COMMAND
========================= */

async function command(
    text
) {

    if (
        !text.trim()
    ) {

        return;

    }


    addMessage(
        text,
        true
    );


    input.value =
        "";


    const response =
        await nova(
            text
        );


    addMessage(
        response
    );


    /*
     * IMPORTANT:
     *
     * Speech happens here,
     * after the AI response.
     */

    speak(
        response
    );

}


/* =========================
   SEND BUTTON
========================= */

send.addEventListener(
    "click",
    () => {

        command(
            input.value
        );

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            command(
                input.value
            );

        }

    }
);


/* =========================
   VOICE INPUT
========================= */

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (Recognition) {


    const recognition =
        new Recognition();


    recognition.lang =
        "en-GB";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    orb.addEventListener(
        "click",
        () => {

            setState(
                "Listening...",
                "listening"
            );


            try {

                /*
                 * Start speech synthesis
                 * context from the tap.
                 *
                 * This helps Safari/iOS
                 * allow later speech.
                 */

                if (
                    window.speechSynthesis
                ) {

                    window.speechSynthesis
                        .cancel();

                }


                recognition.start();

            } catch (
                error
            ) {

                console.log(
                    error
                );

            }

        }
    );


    recognition.onresult =
        event => {

            const text =
                event
                    .results[0][0]
                    .transcript;


            command(
                text
            );

        };


    recognition.onend =
        () => {

            if (
                !orb.classList.contains(
                    "thinking"
                ) &&
                !orb.classList.contains(
                    "speaking"
                )
            ) {

                setState(
                    "Ready"
                );

            }

        };


    recognition.onerror =
        event => {

            console.log(
                "Recognition error:",
                event.error
            );


            setState(
                "Try again"
            );


            setTimeout(
                () => {

                    setState(
                        "Ready"
                    );

                },
                1500
            );

        };

}


/* =========================
   LOAD AI
========================= */

async function initialiseAI() {

    if (
        !window.NOVA_AI
    ) {

        setState(
            "AI unavailable"
        );

        return;

    }


    try {

        setState(
            "Loading AI..."
        );


        await window.NOVA_AI.load();


        setState(
            "Ready"
        );


        console.log(
            "NOVA AI ready."
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        setState(
            "Local AI unavailable"
        );

    }

}


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    () => {

        /*
         * Give the page a moment to
         * initialise the AI module.
         */

        setTimeout(
            initialiseAI,
            500
        );

    }
);


</script>


</body>

</html>
